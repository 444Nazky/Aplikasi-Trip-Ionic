<ion-page>
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button default-href="/home"></ion-back-button>
      </ion-buttons>
      <ion-title>Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <div class="login-container">
      <div class="logo-section">
        <h1 class="app-title">TRIP ANGKUTAN</h1>
        <p class="subtitle">Masuk dengan PIN Anda</p>
      </div>

      <div class="pin-container">
        <ion-input
          type="tel"
          inputmode="numeric"
          maxlength="6"
          placeholder="_"
          [(ngModel)]="pin"
          (ngModelChange)="onPinChange($event)"
          class="pin-input"
        ></ion-input>

        <div class="pin-dots">
          @for (dot of [0, 1, 2, 3, 4, 5]; track dot) {
            <div class="pin-dot" [class.filled]="pin.length > dot"></div>
          }
        </div>
      </div>

      <ion-button expand="block" (click)="login()" [disabled]="pin.length !== 6 || loading" class="login-btn">
        @if (loading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <span>MASUK</span>
        }
      </ion-button>
    </div>
  </ion-content>
</ion-page>
