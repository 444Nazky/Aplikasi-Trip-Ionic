<ion-content class="ion-no-border">
  <div class="login-page">
    <!-- Hero Section -->
    <div class="login-hero">
      <div class="hero-icon">
        <ion-icon name="bus"></ion-icon>
      </div>
      <h1 class="hero-title">Trip Angkutan</h1>
      <p class="hero-desc">Sistem Pencatatan Angkutan Perkebunan</p>
    </div>

    <!-- Device Region Lock Card -->
    <div class="device-lock-card">
      <div class="lock-icon">
        <ion-icon name="shield-checkmark"></ion-icon>
      </div>
      <div class="lock-info">
        <span class="lock-title">Device Region Locked</span>
        <span class="lock-region">BADAU</span>
      </div>
    </div>

    <!-- Main Login Card -->
    <div class="login-card">
      <!-- Officer Selection -->
      <div class="officer-section">
        <span class="section-label">Petugas</span>
        <div class="officer-pill">
          <div class="officer-avatar">
            <ion-icon name="person"></ion-icon>
          </div>
          <div class="officer-details">
            <span class="officer-name">Budi Santoso</span>
            <span class="officer-id">ID: OFF-001</span>
          </div>
          <ion-icon name="chevron-down" class="chevron"></ion-icon>
        </div>
      </div>

      <!-- PIN Input Section -->
      <div class="pin-section">
        <span class="section-label">PIN Akses</span>

        <!-- PIN Dots Display -->
        <div class="pin-display">
          <div *ngFor="let dot of [0,1,2,3,4,5]"
               class="pin-dot"
               [class.filled]="pin.length > dot"
               [class.error]="error">
          </div>
        </div>

        <p class="pin-hint" *ngIf="!error">Masukkan 6-digit PIN Anda</p>
        <p class="pin-hint text-danger" *ngIf="error">PIN tidak valid. Coba lagi.</p>

        <!-- Hidden input for keyboard -->
        <input type="password" inputmode="numeric" maxlength="6"
               [(ngModel)]="pin" class="pin-hidden-input" (keyup.enter)="login()" autofocus/>
      </div>

      <!-- Numpad -->
      <div class="numpad">
        <button *ngFor="let num of [1,2,3,4,5,6,7,8,9]"
                class="numpad-key"
                (click)="pressKey(num.toString())">
          {{ num }}
        </button>
        <div class="numpad-key empty"></div>
        <button class="numpad-key" (click)="pressKey('0')">0</button>
        <button class="numpad-key backspace" (click)="pressBackspace()">
          <ion-icon name="backspace-outline"></ion-icon>
        </button>
      </div>

      <!-- Login Button -->
      <ion-button expand="block" class="login-btn"
                  [disabled]="loading || pin.length !== 6"
                  (click)="login()">
        <ion-spinner *ngIf="loading" name="dots" class="btn-spinner"></ion-spinner>
        <span *ngIf="!loading">Masuk</span>
      </ion-button>
    </div>

    <!-- Footer -->
    <p class="login-footer">Trip Angkutan · v1.0</p>
  </div>
</ion-content>
