<ion-header>
  <ion-toolbar>
    <ion-title>Trip Selesai</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center" *ngIf="trip">
  <ion-icon name="checkmark-circle" color="success" style="font-size: 72px"></ion-icon>
  <h2>{{ trip.noTrip }}</h2>
  <p>{{ trip.vehicles.length }} kendaraan tercatat</p>
  <p>Total: {{ total | currency: 'IDR' }}</p>
  <p *ngIf="!trip.isSynced" class="ion-color-warning">
    Data akan disinkronkan saat online.
  </p>
  <ion-button expand="block" (click)="done()">SELESAI</ion-button>
</ion-content>
